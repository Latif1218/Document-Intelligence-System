services:
  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: docintel_loadbalancer
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - edge-net
      - app-net

  # DATA LAYER PostgreSQL 16 with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docintel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # QUEUE LAYER Redis 7
  redis:
    image: redis:7-alpine
    container_name: docintel_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-net
      - worker-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # STORAGE LAYER MinIO(For(S3-Compatible via pgsty/silo))
  minio:
    image: pgsty/silo:latest
    container_name: docintel_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "/usr/bin/silo", "healthcheck", "ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PYTHON PROCESSING SERVICE (For (OCR / Parser))
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: docintel_python_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - worker-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # dashboard server
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: docintel_dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - edge-net
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # APPLICATION LAYER Node.js Express REST API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app-net
      - backend-net
      - data-net

  # WORKER NETWORK BullMQ Pipeline Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: docintel_worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      python-service:
        condition: service_started
    networks:
      - backend-net
      - worker-net
      - data-net

# NETWORKS 
networks:
  edge-net:
    driver: bridge
  app-net:
    driver: bridge
  backend-net:
    driver: bridge
  worker-net:
    driver: bridge
  data-net:
    driver: bridge

# PERSISTENT VOLUMES
volumes:
  postgres_data:
  redis_data:
  minio_data:
